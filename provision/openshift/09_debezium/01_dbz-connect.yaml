kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: debezium-cone-template
objects:
  - apiVersion: kafka.strimzi.io/v1beta2
    kind: KafkaConnect
    metadata:
      name: debezium-kafka-connect-cluster
      namespace: ${PJ_NAME}
      annotations:
        strimzi.io/use-connector-resources: "true"
    spec:
      version: 4.0.0
      build:
        output:
          type: imagestream
          image: debezium-streams-connect:latest
        plugins:
          - artifacts:
              - type: zip
                url: 'https://maven.repository.redhat.com/ga/io/debezium/debezium-connector-postgres/3.0.8.Final-redhat-00004/debezium-connector-postgres-3.0.8.Final-redhat-00004-plugin.zip'
            name: debezium-connector-postgres
          - artifacts:
              - type: zip
                url: 'https://maven.repository.redhat.com/ga/io/debezium/debezium-connector-mysql/3.0.8.Final-redhat-00004/debezium-connector-mysql-3.0.8.Final-redhat-00004-plugin.zip'
            name: debezium-connector-mysql
          - artifacts:
              - type: zip
                url: 'https://maven.repository.redhat.com/ga/io/debezium/debezium-connector-jdbc/3.0.8.Final-redhat-00004/debezium-connector-jdbc-3.0.8.Final-redhat-00004-plugin.zip'
            name: debezium-connector-jdbc
      bootstrapServers: "kafka-cluster-kafka-bootstrap.${PJ_NAME}.svc:9092"
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: debezium-streams-connect
      namespace: ${PJ_NAME}
parameters:
  - name: PJ_NAME
    displayName: project name
    description: project name
    value: "user1-dev"
    required: true