kind: Template
apiVersion: template.openshift.io/v1
objects: 
- kind: DevWorkspaceTemplate
  apiVersion: workspace.devfile.io/v1alpha2
  metadata:
    name: che-code-camelk-ws
    namespace: ${NAMESPACE_PARAM}
  spec:
    commands:
      - apply:
          component: che-code-injector
        id: init-container-command
      - exec:
          commandLine: nohup /checode/entrypoint-volume.sh > /checode/entrypoint-logs.txt 2>&1 &
          component: che-code-runtime-description
        id: init-che-code-command
    components:
      - container:
          cpuRequest: 30m
          command:
            - /entrypoint-init-container.sh
          env:
            - name: CHE_DASHBOARD_URL
              value: '${DEVSPACES_URL}'
            - name: CHE_PLUGIN_REGISTRY_URL
              value: '${DEVSPACES_URL}/plugin-registry/v3'
            - name: CHE_PLUGIN_REGISTRY_INTERNAL_URL
              value: 'http://plugin-registry.devspaces.svc:8080/v3'
            - name: CLUSTER_CONSOLE_URL
              value: '${CLUSTER_CONSOLE_URL}'
            - name: CLUSTER_CONSOLE_TITLE
              value: OpenShift console
            - name: OPENVSX_REGISTRY_URL
              value: ''
          memoryRequest: 32Mi
          sourceMapping: /projects
          cpuLimit: 500m
          volumeMounts:
            - name: checode
              path: /checode
          memoryLimit: 256Mi
          image: 'registry.redhat.io/devspaces/code-rhel8@sha256:02c8f907dc2e18c61fa643accbf8378f385d3368af49794a78b9529cc63eb636'
        name: che-code-injector
      - attributes:
          app.kubernetes.io/component: che-code-runtime
          app.kubernetes.io/part-of: che-code.eclipse.org
          controller.devfile.io/container-contribution: true
        container:
          cpuRequest: 30m
          env:
            - name: CHE_DASHBOARD_URL
              value: '${DEVSPACES_URL}'
            - name: CHE_PLUGIN_REGISTRY_URL
              value: '${DEVSPACES_URL}/plugin-registry/v3'
            - name: CHE_PLUGIN_REGISTRY_INTERNAL_URL
              value: 'http://plugin-registry.devspaces.svc:8080/v3'
            - name: CLUSTER_CONSOLE_URL
              value: '${CLUSTER_CONSOLE_URL}'
            - name: CLUSTER_CONSOLE_TITLE
              value: OpenShift console
            - name: OPENVSX_REGISTRY_URL
              value: ''
          memoryRequest: 256Mi
          sourceMapping: /projects
          cpuLimit: 500m
          volumeMounts:
            - name: checode
              path: /checode
          memoryLimit: 1024Mi
          image: 'registry.redhat.io/devspaces/udi-rhel8@sha256:d147892c643a0127cfcf868daee0ff416a8df922fe2a7c716ebfc457ff526fa2'
          endpoints:
            - attributes:
                cookiesAuthEnabled: true
                discoverable: false
                type: main
                urlRewriteSupported: true
              exposure: public
              name: che-code
              protocol: https
              secure: true
              targetPort: 3100
            - attributes:
                discoverable: false
                urlRewriteSupported: false
              exposure: public
              name: code-redirect-1
              protocol: https
              targetPort: 13131
            - attributes:
                discoverable: false
                urlRewriteSupported: false
              exposure: public
              name: code-redirect-2
              protocol: https
              targetPort: 13132
            - attributes:
                discoverable: false
                urlRewriteSupported: false
              exposure: public
              name: code-redirect-3
              protocol: https
              targetPort: 13133
        name: che-code-runtime-description
      - name: checode
        volume: {}
    events:
      postStart:
        - init-che-code-command
      preStart:
        - init-container-command
parameters: 
- name: DEVSPACES_URL
  displayName: OpenShift DevSpaces URL
  description: DEVSPACES_URL
  required: true
- name: CLUSTER_CONSOLE_URL
  displayName: OpenShift WEB CONSOLE URL
  description: CLUSTER_CONSOLE_URL
  required: true
- name: NAMESPACE_PARAM
  displayName: OpenShift DevSpaces Namespace
  description: OpenShift DevSpaces Namespace
  required: true